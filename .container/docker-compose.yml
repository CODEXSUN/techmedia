name: techmedia

x-api-env: &api-env
  NODE_ENV: production
  AUTH_MODE: ${AUTH_MODE:-jwt}
  PLATFORM_API_PORT: ${PLATFORM_API_PORT:-7050}
  PLATFORM_WEB_PORT: ${PLATFORM_WEB_PORT:-7060}
  PLATFORM_API_URL: ${PLATFORM_API_URL:-http://techmedia-api:7050}
  PLATFORM_WEB_ORIGIN: ${PLATFORM_WEB_ORIGIN:?PLATFORM_WEB_ORIGIN is required}
  PLATFORM_WEB_ORIGINS: ${PLATFORM_WEB_ORIGINS:-}
  PLATFORM_WEB_HEALTH_URL: ${PLATFORM_WEB_HEALTH_URL:-http://techmedia-web:80}
  DB_DRIVER: mariadb
  DB_HOST: codexsun-mariadb
  DB_PORT: 3306
  DB_USER: ${DB_USER:-codexsun_app}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_MASTER_NAME: ${DB_MASTER_NAME:-techmedia_master}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  TECHMEDIA_DB_FRESH_ON_START: "0"
  TECHMEDIA_ALLOW_PRODUCTION_DB_RESET: "0"
  TECHMEDIA_BACKUP_DIR: /storage/backups/database
  TECHMEDIA_VERIFIED_BACKUP_ID: ${TECHMEDIA_VERIFIED_BACKUP_ID:-}
  TECHMEDIA_QUEUE_BACKEND: ${TECHMEDIA_QUEUE_BACKEND:-bullmq-redis}
  TECHMEDIA_REDIS_URL: ${TECHMEDIA_REDIS_URL:?TECHMEDIA_REDIS_URL is required}
  TECHMEDIA_QUEUE_WORKER_ENABLED: ${TECHMEDIA_QUEUE_WORKER_ENABLED:-1}
  TECHMEDIA_QUEUE_WORKER_INTERVAL_MS: ${TECHMEDIA_QUEUE_WORKER_INTERVAL_MS:-5000}
  TECHMEDIA_QUEUE_COMPLETED_RETENTION_DAYS: ${TECHMEDIA_QUEUE_COMPLETED_RETENTION_DAYS:-14}
  TECHMEDIA_QUEUE_FAILED_RETENTION_DAYS: ${TECHMEDIA_QUEUE_FAILED_RETENTION_DAYS:-30}
  TECHMEDIA_ALLOW_LIVE_RESTORE: "0"
  TECHMEDIA_LIVE_RESTORE_CONFIRM: ""
  TECHMEDIA_RESTORE_TEST_DB_NAME: ${TECHMEDIA_RESTORE_TEST_DB_NAME:-}
  STORAGE_ROOT: /storage/app
  STORAGE_PUBLIC_ROOT: /storage/public
  ENABLE_DEFAULT_TENANT_SEED: ${ENABLE_DEFAULT_TENANT_SEED:-1}
  DEFAULT_TENANT_CORPORATE_ID: ${DEFAULT_TENANT_CORPORATE_ID:-TECHMEDIA}
  DEFAULT_TENANT_DB_NAME: ${DEFAULT_TENANT_DB_NAME:-techmedia_tenant_default}
  DEFAULT_TENANT_DOMAIN: ${DEFAULT_TENANT_DOMAIN:-app.techmedia.in}
  DEFAULT_TENANT_NAME: ${DEFAULT_TENANT_NAME:-TechMedia}
  DEFAULT_TENANT_SLUG: ${DEFAULT_TENANT_SLUG:-techmedia}
  DEFAULT_TENANT_ADMIN_NAME: ${DEFAULT_TENANT_ADMIN_NAME:-}
  DEFAULT_TENANT_ADMIN_EMAIL: ${DEFAULT_TENANT_ADMIN_EMAIL:-}
  DEFAULT_TENANT_ADMIN_PASSWORD: ${DEFAULT_TENANT_ADMIN_PASSWORD:-}
  TENANT_DOMAIN_BASE: ${TENANT_DOMAIN_BASE:-techmedia.in}
  SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-}
  SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
  SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
  SOFTWARE_ADMIN_NAME: ${SOFTWARE_ADMIN_NAME:-}
  SOFTWARE_ADMIN_EMAIL: ${SOFTWARE_ADMIN_EMAIL:-}
  SOFTWARE_ADMIN_PASSWORD: ${SOFTWARE_ADMIN_PASSWORD:-}
  TENANT_ADMIN_NAME: ${TENANT_ADMIN_NAME:-}
  TENANT_ADMIN_EMAIL: ${TENANT_ADMIN_EMAIL:-}
  TENANT_ADMIN_PASSWORD: ${TENANT_ADMIN_PASSWORD:-}

services:
  storage-init:
    image: ${TECHMEDIA_IMAGE_REGISTRY:-codexsun}/techmedia-api:${TECHMEDIA_API_IMAGE_TAG:-1.0.2}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      [
        "mkdir -p /storage/app /storage/public /storage/tenants /storage/backups/database && chown -R 1000:1000 /storage"
      ]
    volumes: ["techmedia-data:/storage"]
    networks: [edge]
    restart: "no"

  platform-migrate:
    build:
      context: ../..
      dockerfile: techmedia/.container/Dockerfile.api
      target: migrations
      args:
        NODE_RUNTIME_VERSION: ${NODE_RUNTIME_VERSION:-26.5.0}
        NPM_RUNTIME_VERSION: ${NPM_RUNTIME_VERSION:-12.0.1}
    image: ${TECHMEDIA_IMAGE_REGISTRY:-codexsun}/techmedia-migrations:${TECHMEDIA_MIGRATIONS_IMAGE_TAG:-1.0.2}
    profiles: [tools]
    environment:
      <<: *api-env
    volumes: ["techmedia-data:/storage"]
    networks: [edge]

  techmedia-api:
    build:
      context: ../..
      dockerfile: techmedia/.container/Dockerfile.api
      target: runtime
      args:
        TECHMEDIA_VERSION: ${TECHMEDIA_VERSION:-1.0.2}
        NODE_RUNTIME_VERSION: ${NODE_RUNTIME_VERSION:-26.5.0}
        NPM_RUNTIME_VERSION: ${NPM_RUNTIME_VERSION:-12.0.1}
    image: ${TECHMEDIA_IMAGE_REGISTRY:-codexsun}/techmedia-api:${TECHMEDIA_API_IMAGE_TAG:-1.0.2}
    container_name: techmedia-api
    restart: unless-stopped
    depends_on:
      storage-init: { condition: service_completed_successfully }
    environment:
      <<: *api-env
    ports:
      - "${TECHMEDIA_BIND_ADDRESS:-127.0.0.1}:${PLATFORM_API_HOST_PORT:-18050}:${PLATFORM_API_PORT:-7050}"
    volumes: ["techmedia-data:/storage"]
    networks: [edge]

  techmedia-web:
    build:
      context: ../..
      dockerfile: techmedia/.container/Dockerfile.web
      args:
        TECHMEDIA_VERSION: ${TECHMEDIA_VERSION:-1.0.2}
        NODE_RUNTIME_VERSION: ${NODE_RUNTIME_VERSION:-26.5.0}
        NPM_RUNTIME_VERSION: ${NPM_RUNTIME_VERSION:-12.0.1}
        DEFAULT_TENANT_NAME: ${DEFAULT_TENANT_NAME:-TechMedia}
    image: ${TECHMEDIA_IMAGE_REGISTRY:-codexsun}/techmedia-web:${TECHMEDIA_WEB_IMAGE_TAG:-1.0.2}
    container_name: techmedia-web
    restart: unless-stopped
    depends_on:
      techmedia-api: { condition: service_healthy }
    ports:
      - "${TECHMEDIA_BIND_ADDRESS:-127.0.0.1}:${PLATFORM_WEB_HOST_PORT:-18060}:80"
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${CODEXSUN_EDGE_NETWORK:-codexsun-network}
      traefik.http.routers.techmedia-web.rule: "Host(`${TECHMEDIA_WEB_HOST:-app.techmedia.in}`)"
      traefik.http.routers.techmedia-web.entrypoints: websecure
      traefik.http.routers.techmedia-web.tls: "true"
      traefik.http.routers.techmedia-web.tls.certresolver: letsencrypt
      traefik.http.routers.techmedia-web.middlewares: techmedia-security-headers
      traefik.http.services.techmedia-web.loadbalancer.server.port: "80"
      traefik.http.middlewares.techmedia-security-headers.headers.stsseconds: "31536000"
      traefik.http.middlewares.techmedia-security-headers.headers.stsincludesubdomains: "true"
      traefik.http.middlewares.techmedia-security-headers.headers.stspreload: "true"
    networks: [edge]

volumes:
  techmedia-data:
    name: ${TECHMEDIA_DATA_VOLUME:-techmedia-platform-data}

networks:
  edge:
    name: ${CODEXSUN_EDGE_NETWORK:-codexsun-network}
    external: true
