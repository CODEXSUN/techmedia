name: ${TECHMEDIA_COMPOSE_PROJECT:-techmedia}

services:
  verify:
    profiles: [tools]
    build:
      context: ..
      dockerfile: .container/scripts/Dockerfile.stack
      target: verify
      args:
        NODE_RUNTIME_VERSION: ${NODE_RUNTIME_VERSION:-26.5.0}
        NPM_RUNTIME_VERSION: ${NPM_RUNTIME_VERSION:-12.0.1}
    image: ${TECHMEDIA_IMAGE_REGISTRY:-techmedia}/verify:${TECHMEDIA_IMAGE_TAG:-local}

  mariadb:
    image: ${MARIADB_IMAGE:-mariadb:11.8}
    container_name: ${TECHMEDIA_MARIADB_CONTAINER_NAME:-techmedia-mariadb}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      MARIADB_DATABASE: ${DB_NAME:?DB_NAME is required}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}
      MARIADB_USER: ${DB_USER:?DB_USER is required}
    volumes:
      - mariadb-data:/var/lib/mysql
    networks: [techmedia]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: .container/scripts/Dockerfile.stack
      target: api-runtime
      args:
        NODE_RUNTIME_VERSION: ${NODE_RUNTIME_VERSION:-26.5.0}
        NPM_RUNTIME_VERSION: ${NPM_RUNTIME_VERSION:-12.0.1}
    image: ${TECHMEDIA_IMAGE_REGISTRY:-techmedia}/api:${TECHMEDIA_IMAGE_TAG:-local}
    container_name: ${TECHMEDIA_API_CONTAINER_NAME:-techmedia-api}
    restart: unless-stopped
    env_file:
      - ${TECHMEDIA_RUNTIME_ENV_FILE:-../.env}
    environment:
      DEV_AUTO_LOGIN: "0"
      NODE_ENV: production
      TZ: ${TZ:-Asia/Kolkata}
      PLATFORM_API_PORT: ${TECHMEDIA_API_INTERNAL_PORT:-7050}
      TECHMEDIA_ENV_FILE_PATH: /workspace/techmedia/.env
      MOBILE_RELEASE_STORAGE_ROOT: /workspace/techmedia/storage/mobile/release
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${TECHMEDIA_BIND_ADDRESS:-127.0.0.1}:${TECHMEDIA_API_HOST_PORT:-7050}:${TECHMEDIA_API_INTERNAL_PORT:-7050}"
    volumes:
      - ${TECHMEDIA_RUNTIME_ENV_FILE:-../.env}:/workspace/techmedia/.env:rw
      - codex-data:/home/node/.codex
      - mobile-releases:/workspace/techmedia/storage/mobile/release
    networks: [techmedia]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+process.env.PLATFORM_API_PORT+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 18

  web:
    build:
      context: ..
      dockerfile: .container/scripts/Dockerfile.stack
      target: web-runtime
      args:
        NODE_RUNTIME_VERSION: ${NODE_RUNTIME_VERSION:-26.5.0}
        NPM_RUNTIME_VERSION: ${NPM_RUNTIME_VERSION:-12.0.1}
    image: ${TECHMEDIA_IMAGE_REGISTRY:-techmedia}/web:${TECHMEDIA_IMAGE_TAG:-local}
    container_name: ${TECHMEDIA_WEB_CONTAINER_NAME:-techmedia-web}
    restart: unless-stopped
    environment:
      NGINX_ENVSUBST_FILTER: TECHMEDIA_API
      TECHMEDIA_API_CONTAINER_NAME: ${TECHMEDIA_API_CONTAINER_NAME:-techmedia-api}
      TECHMEDIA_API_INTERNAL_PORT: ${TECHMEDIA_API_INTERNAL_PORT:-7050}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${TECHMEDIA_BIND_ADDRESS:-127.0.0.1}:${TECHMEDIA_WEB_HOST_PORT:-7060}:80"
    networks: [techmedia]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12

volumes:
  codex-data:
    name: ${TECHMEDIA_CODEX_DATA_VOLUME:-techmedia-codex-data}
  mariadb-data:
    name: ${TECHMEDIA_MARIADB_DATA_VOLUME:-techmedia-mariadb-data}
  mobile-releases:
    name: ${TECHMEDIA_MOBILE_RELEASES_VOLUME:-techmedia-mobile-releases}

networks:
  techmedia:
    name: ${TECHMEDIA_NETWORK:-techmedia-network}
    external: ${TECHMEDIA_NETWORK_EXTERNAL:-false}
